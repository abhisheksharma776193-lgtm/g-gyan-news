<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b91c1c"><meta name="description" content="G Gyan News — हिंदी में ताज़ा खबरें">
<title>G Gyan News | सच्ची खबर, सबसे पहले</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif}
header{background:#111827;color:white;padding:14px;position:sticky;top:0;z-index:5}.top{display:flex;align-items:center;gap:10px}.logo{background:#b91c1c;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-weight:900}.brand{flex:1}.brand h1{margin:0;font-size:20px}.tag{color:#d1d5db;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#b91c1c;color:white;font-weight:750;cursor:pointer}.gray{background:#374151}.light{background:#e5e7eb;color:#111827}.search{display:flex;gap:8px;margin-top:12px}.search input{flex:1;min-width:0;padding:12px;border:0;border-radius:10px;font-size:15px}
nav{display:flex;gap:8px;overflow:auto;background:white;padding:10px 12px}nav button{white-space:nowrap;border:0;border-radius:22px;padding:9px 13px;background:#f3f4f6;font-weight:700}nav .active{background:#b91c1c;color:white}
main{max-width:900px;margin:auto;padding:12px}.ticker{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:13px;font-weight:700}.head{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}.head h2{margin:0;font-size:19px}.muted{color:#64748b;font-size:12px}.cards{display:grid;gap:12px}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #1118270b}.thumb{height:190px;background:#d1d5db;display:grid;place-items:center;overflow:hidden;font-weight:800;color:#4b5563}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.body{padding:13px}.meta{display:flex;justify-content:space-between;gap:8px;color:#64748b;font-size:12px}.card h3{font-size:18px;line-height:1.45;margin:8px 0}.card p{font-size:14px;line-height:1.6;color:#4b5563;white-space:pre-wrap}.link{border:0;background:none;color:#b91c1c;font-weight:800;padding:0}.empty{background:white;padding:25px;border-radius:12px;text-align:center;color:#64748b}
.panel{display:none;background:white;border-radius:14px;padding:14px;margin-top:14px}.panel.show{display:block}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.field select{font:inherit;padding:11px;border:1px solid #d1d5db;border-radius:9px;width:100%;background:white}.field textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice,.status{padding:10px;border-radius:9px;font-size:12px;line-height:1.6;background:#fffbeb;color:#854d0e}.status{margin:10px 0;background:#eff6ff;color:#1d4ed8}.status.error{background:#fef2f2;color:#991b1b}.status.ok{background:#f0fdf4;color:#166534}.item{border-top:1px solid #e5e7eb;padding:12px 0}footer{text-align:center;color:#6b7280;padding:24px;font-size:12px}
dialog{border:0;border-radius:14px;width:calc(100% - 24px);max-width:650px;padding:18px}dialog::backdrop{background:#11182799}dialog img,dialog video{max-width:100%;border-radius:10px}.close{float:right;background:#e5e7eb;color:#111827}
@media(min-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:175px}}
</style></head><body>
<header><div class="top"><div class="logo">GG</div><div class="brand"><h1>G Gyan News</h1><div class="tag">सच्ची खबर, सबसे पहले</div></div><button class="btn gray" id="adminToggle">एडमिन लॉगिन</button></div>
<div class="search"><input id="q" placeholder="खबर खोजें..." aria-label="खबर खोजें"><button class="btn" id="searchBtn">खोजें</button></div></header>
<nav id="cats"><button class="active" data-cat="सभी">सभी खबरें</button><button data-cat="बिहार">बिहार</button><button data-cat="देश">देश</button><button data-cat="राजनीति">राजनीति</button><button data-cat="वायरल">वायरल</button><button data-cat="फोटो-वीडियो">फोटो-वीडियो</button></nav>
<main><div class="ticker">ताज़ा अपडेट · खबर के स्रोत और तथ्यों की जाँच करें</div>
<div class="head"><h2 id="listTitle">लेटेस्ट न्यूज़</h2><span id="count" class="muted"></span></div><section id="news" class="cards"><div class="empty">खबरें लोड हो रही हैं…</div></section>
<section id="panel" class="panel"><h2>एडमिन पैनल</h2>
<div id="loginArea"><p class="notice">Supabase में पहले अपना एडमिन यूज़र बनाएँ और SQL निर्देशों से admin role दें।</p>
<form id="loginForm"><div class="field"><label for="email">एडमिन ईमेल</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">पासवर्ड</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div><button class="btn">लॉगिन</button></form><div id="loginMsg" class="status" hidden></div></div>
<div id="editor" hidden><div id="session" class="status ok"></div><div class="actions"><button class="btn gray" id="logout">लॉगआउट</button><button class="btn light" id="refresh">रिफ्रेश</button></div>
<form id="postForm"><div class="field"><label for="title">खबर का शीर्षक *</label><input id="title" maxlength="180" required></div><div class="field"><label for="category">कैटेगरी</label><select id="category"><option>बिहार</option><option>देश</option><option>राजनीति</option><option>वायरल</option><option>फोटो-वीडियो</option></select></div>
<div class="field"><label for="summary">खबर का विवरण *</label><textarea id="summary" required></textarea></div><div class="field"><label for="imageUrl">फोटो URL (वैकल्पिक)</label><input id="imageUrl" type="url" placeholder="https://..."></div><div class="field"><label for="videoUrl">वीडियो URL (वैकल्पिक)</label><input id="videoUrl" type="url" placeholder="https://.../video.mp4"></div><div class="field"><label><input id="published" type="checkbox" checked style="width:auto"> तुरंत प्रकाशित करें</label></div>
<div class="actions"><button class="btn" id="saveBtn">खबर सेव करें</button><button type="button" class="btn light" id="cancel" hidden>एडिट रद्द करें</button></div></form><div class="head"><h2>खबरें मैनेज करें</h2></div><div id="manage"></div></div></section></main>
<footer>© <span id="year"></span> G Gyan News · सटीक और जिम्मेदार पत्रकारिता</footer>
<dialog id="dlg"><button class="btn close" id="close">बंद करें</button><div id="full"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* यहाँ केवल public anon/publishable key डालें; service_role/secret key कभी नहीं। */
const SUPABASE_URL="https://doykvsemxlivfrgnxbdh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_RqQUJUFqQMmu4g1CD33LGw_YujRK1fa";
const ready=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("PASTE_")&&!SUPABASE_ANON_KEY.includes("PASTE_")&&window.supabase;
const db=ready?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const $=id=>document.getElementById(id);let news=[],cat="सभी",user=null,editing=null;
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function media(s){try{let u=new URL(s);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
function dt(s){try{return new Date(s).toLocaleString("hi-IN",{dateStyle:"medium",timeStyle:"short"})}catch{return ""}}
function msg(id,s,kind=""){let e=$(id);e.textContent=s;e.className="status "+kind;e.hidden=false}
async function load(){if(!db){$("news").innerHTML='<div class="empty">सेटअप बाकी है। README में बताए अनुसार Supabase URL और public key डालें।</div>';$("count").textContent="सेटअप बाकी";return}
$("news").innerHTML='<div class="empty">खबरें लोड हो रही हैं…</div>';let query=db.from("news").select("id,title,category,summary,image_url,video_url,is_published,created_at");if(!user)query=query.eq("is_published",true);let {data,error}=await query.order("created_at",{ascending:false}).limit(100);
if(error){$("news").innerHTML='<div class="empty">खबरें लोड नहीं हुईं। Database और RLS setup जाँचें।</div>';console.error(error);return}news=data||[];render();if(user)manage()}
function render(){let q=$("q").value.trim().toLocaleLowerCase("hi"),arr=news.filter(n=>(cat==="सभी"||n.category===cat)&&(!q||(n.title+" "+n.summary+" "+n.category).toLocaleLowerCase("hi").includes(q)));
$("listTitle").textContent=q?"खोज के परिणाम":cat==="सभी"?"लेटेस्ट न्यूज़":cat+" की खबरें";$("count").textContent=arr.length+" खबरें";
$("news").innerHTML=arr.length?arr.map(n=>{let im=media(n.image_url),v=media(n.video_url);return `<article class="card">${v?`<div class="thumb"><video controls preload="metadata" src="${esc(v)}"></video></div>`:im?`<div class="thumb"><img loading="lazy" src="${esc(im)}" alt="${esc(n.title)}"></div>`:'<div class="thumb">G Gyan News</div>'}<div class="body"><div class="meta"><span>${esc(n.category)}</span><span>${esc(dt(n.created_at))}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.summary.length>155?n.summary.slice(0,155)+"…":n.summary)}</p><button class="link" data-read="${esc(n.id)}">पूरी खबर पढ़ें →</button></div></article>`}).join(""):'<div class="empty">कोई खबर नहीं मिली।</div>'}
function manage(){$("manage").innerHTML=news.length?news.map(n=>`<div class="item"><b>${esc(n.title)}</b><div class="meta"><span>${esc(n.category)}</span><span>${n.is_published?"प्रकाशित":"ड्राफ्ट"}</span></div><div class="actions" style="margin-top:8px"><button class="btn gray" data-edit="${n.id}">एडिट</button><button class="btn light" data-toggle="${n.id}" data-pub="${n.is_published?1:0}">${n.is_published?"ड्राफ्ट करें":"प्रकाशित करें"}</button><button class="btn light" data-del="${n.id}">डिलीट</button></div></div>`).join(""):'<p class="muted">अभी खबर नहीं है।'}
function clearForm(){$("postForm").reset();$("published").checked=true;editing=null;$("cancel").hidden=true;$("saveBtn").textContent="खबर सेव करें"}
async function session(){if(!db)return;let {data:{session}}=await db.auth.getSession();user=session?.user||null;$("loginArea").hidden=!!user;$("editor").hidden=!user;$("adminToggle").textContent=user?"एडमिन पैनल":"एडमिन लॉगिन";if(user){$("session").textContent="लॉगिन: "+user.email;await load()}}
$("adminToggle").onclick=()=>{$("panel").classList.toggle("show");if($("panel").classList.contains("show")){$("panel").scrollIntoView({behavior:"smooth"});if(!db)msg("loginMsg","पहले README के अनुसार Supabase setup पूरा करें।","error")}};
$("cats").onclick=e=>{let b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));render()};
$("searchBtn").onclick=render;$("q").oninput=render;
$("news").onclick=e=>{let b=e.target.closest("[data-read]");if(!b)return;let n=news.find(x=>x.id===b.dataset.read);if(!n)return;$("full").innerHTML=`<div class="meta">${esc(n.category)} · ${esc(dt(n.created_at))}</div><h2>${esc(n.title)}</h2>${media(n.image_url)?`<img style="width:100%" src="${esc(media(n.image_url))}">`:""}${media(n.video_url)?`<video controls style="width:100%" src="${esc(media(n.video_url))}"></video>`:""}<p style="white-space:pre-wrap;line-height:1.8">${esc(n.summary)}</p>`;$("dlg").showModal()};
$("close").onclick=()=>$("dlg").close();
$("loginForm").onsubmit=async e=>{e.preventDefault();if(!db)return msg("loginMsg","पहले Supabase URL/key सेट करें।","error");let {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return msg("loginMsg","लॉगिन असफल। ईमेल, पासवर्ड और Auth settings जाँचें।","error");await session()};
$("logout").onclick=async()=>{await db.auth.signOut();user=null;clearForm();await session()};$("refresh").onclick=load;
$("postForm").onsubmit=async e=>{e.preventDefault();if(!db||!user)return;let p={title:$("title").value.trim(),category:$("category").value,summary:$("summary").value.trim(),image_url:media($("imageUrl").value)||null,video_url:media($("videoUrl").value)||null,is_published:$("published").checked};
$("saveBtn").disabled=true;let r=editing?await db.from("news").update(p).eq("id",editing).select().single():await db.from("news").insert(p).select().single();$("saveBtn").disabled=false;if(r.error){alert("सेव नहीं हुआ। Supabase admin role और RLS जाँचें।");console.error(r.error);return}clearForm();await load();alert("खबर डेटाबेस में सेव हो गई।")};
$("cancel").onclick=clearForm;
$("manage").onclick=async e=>{let ed=e.target.closest("[data-edit]"),tg=e.target.closest("[data-toggle]"),dl=e.target.closest("[data-del]");if(ed){let n=news.find(x=>x.id===ed.dataset.edit);editing=n.id;$("title").value=n.title;$("category").value=n.category;$("summary").value=n.summary;$("imageUrl").value=n.image_url||"";$("videoUrl").value=n.video_url||"";$("published").checked=n.is_published;$("cancel").hidden=false;$("saveBtn").textContent="बदलाव सेव करें";$("title").focus();return}
if(tg){let {error}=await db.from("news").update({is_published:tg.dataset.pub!=="1"}).eq("id",tg.dataset.toggle);if(error)alert("स्थिति बदल नहीं सकी");await load();return}
if(dl&&confirm("क्या इस खबर को डिलीट करना है?")){let {error}=await db.from("news").delete().eq("id",dl.dataset.del);if(error)alert("डिलीट नहीं हुआ");await load()}};
$("year").textContent=new Date().getFullYear();if(db){db.auth.onAuthStateChange(()=>setTimeout(session,0));load();session()}else load();
</script></body></html>
